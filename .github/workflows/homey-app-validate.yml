name: Validate Homey App
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  main:
    name: Validate Homey App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The validate action compiles TypeScript but doesn't install dependencies
      - run: npm ci --ignore-scripts
      - run: npm test
      # `verified` additionally requires a `support` URL in .homeycompose/app.json
      - uses: athombv/github-action-homey-app-validate@0f3b42c15d26aab79d7c48cde4d2805524da910e # master 2024-08-15
        with:
          level: publish
