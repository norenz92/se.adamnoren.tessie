<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5em;
      max-width: 400px;
      margin: 0 auto;
    }

    h2 {
      margin-bottom: 0.25em;
    }

    .help-text {
      font-size: 0.85em;
      color: #999;
      margin-bottom: 1.5em;
      text-align: center;
    }

    .help-text a {
      color: #4A90D9;
      text-decoration: none;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    .form-group {
      width: 100%;
      margin-bottom: 1em;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.75em;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #4A90D9;
    }

    .error-message {
      display: none;
      color: #e74c3c;
      font-size: 0.85em;
      margin-top: 0.5em;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 0.75em;
      font-size: 1em;
      background-color: #4A90D9;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 0.5em;
    }

    button:hover {
      background-color: #357ABD;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Connect to Tessie</h2>
    <p class="help-text">
      Find your API token at
      <a href="https://my.tessie.com/settings/api" target="_blank" rel="noopener noreferrer">Tessie Settings &gt; API</a>
    </p>

    <div class="form-group">
      <input
        type="password"
        id="token"
        placeholder="Enter your Tessie API token"
        autocomplete="off"
      />
    </div>

    <div id="error" class="error-message"></div>

    <button id="submit" onclick="submitToken()">Connect</button>
  </div>

  <script>
    function submitToken() {
      var token = document.getElementById('token').value.trim();
      var errorEl = document.getElementById('error');

      // Hide previous error
      errorEl.style.display = 'none';
      errorEl.textContent = '';

      if (!token) {
        errorEl.textContent = 'Please enter your API token';
        errorEl.style.display = 'block';
        return;
      }

      Homey.showLoadingOverlay();

      Homey.emit('validate_token', token)
        .then(function () {
          Homey.hideLoadingOverlay();
          Homey.nextView();
        })
        .catch(function (err) {
          Homey.hideLoadingOverlay();
          var message = (err && err.message) || 'Could not connect to Tessie. Please try again.';
          errorEl.textContent = message;
          errorEl.style.display = 'block';
        });
    }

    // Allow pressing Enter to submit
    document.getElementById('token').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        submitToken();
      }
    });
  </script>
</body>
</html>
