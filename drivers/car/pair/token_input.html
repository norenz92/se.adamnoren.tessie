<!DOCTYPE html>
<html>
<head>
  <style>
    .steps { margin: 0 0 1.25em; padding-left: 1.25em; line-height: 1.5; }
    .steps li { margin-bottom: 0.35em; }
    .link { color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
    .signup { margin: 1em 0 0; font-size: 0.9em; opacity: 0.8; }
    .error { display: none; margin-top: 0.75em; color: #e74c3c; font-size: 0.9em; }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title">Connect to Tessie</h1>
    <p class="homey-subtitle">Homey connects to your Tesla through Tessie. Paste your Tessie access token to continue.</p>
  </header>

  <ol class="steps">
    <li>Open <a class="link" data-url="https://dash.tessie.com/settings/api">dash.tessie.com/settings/api</a> and sign in.</li>
    <li>Select <strong>Generate Access Token</strong> and copy the token.</li>
    <li>Paste it below.</li>
  </ol>

  <form id="form" class="homey-form">
  <fieldset class="homey-form-fieldset">
    <div class="homey-form-group">
      <label class="homey-form-label" for="token">Tessie access token</label>
      <input class="homey-form-input" id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your access token" />
    </div>
  </fieldset>
  <p id="error" class="error" role="alert"></p>

  <button id="submit" type="submit" class="homey-button-primary-full">Connect</button>
  </form>

  <p class="signup">New to Tessie? <a class="link" data-url="https://share.tessie.com/1oPgpu3hfMb">Create an account</a> (referral link).</p>

  <script type="text/javascript">
    var tokenEl = document.getElementById('token');
    var errorEl = document.getElementById('error');
    var submitEl = document.getElementById('submit');

    // External pages must open via Homey.popup; plain links don't work inside the pairing view
    document.querySelectorAll('[data-url]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.preventDefault();
        Homey.popup(el.getAttribute('data-url'));
      });
    });

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = message ? 'block' : 'none';
    }

    function submitToken() {
      var token = tokenEl.value.trim();
      showError('');
      if (!token) {
        showError('Please paste your Tessie access token.');
        return;
      }
      submitEl.classList.add('is-loading');
      Homey.showLoadingOverlay();
      Homey.emit('validate_token', token)
        .then(function () {
          Homey.hideLoadingOverlay();
          Homey.nextView();
        })
        .catch(function (err) {
          Homey.hideLoadingOverlay();
          submitEl.classList.remove('is-loading');
          showError((err && err.message) || 'Could not connect to Tessie. Please try again.');
        });
    }

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      submitToken();
    });
  </script>
</body>
</html>
