<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!-- Cybertruck: angular truck silhouette -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body - angular, geometric shapes -->
    <path d="M140 540 L200 420 L300 340 L480 260 L700 340 L800 420 L840 540" fill="#FFFFFF" stroke="#FFFFFF"/>
    <!-- Bed - flat truck bed -->
    <path d="M520 260 L700 260 L700 340" fill="#FFFFFF" stroke="#FFFFFF"/>
    <!-- Angular roof -->
    <path d="M300 340 L480 260 L520 260 L520 340" fill="#FFFFFF" stroke="#FFFFFF"/>
    <!-- Undercarriage -->
    <path d="M110 540 L110 590 L270 590 L270 540" fill="#FFFFFF" stroke="#FFFFFF"/>
    <path d="M700 540 L700 590 L860 590 L860 540" fill="#FFFFFF" stroke="#FFFFFF"/>
    <!-- Bottom line -->
    <line x1="270" y1="590" x2="700" y2="590" stroke="#FFFFFF"/>
    <!-- Front wheel - larger for truck -->
    <circle cx="250" cy="590" r="64" fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <circle cx="250" cy="590" r="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Rear wheel -->
    <circle cx="720" cy="590" r="64" fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <circle cx="720" cy="590" r="26" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Windshield - angular -->
    <line x1="320" y1="340" x2="480" y2="268" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Light bar -->
    <line x1="180" y1="460" x2="240" y2="440" stroke="#FFFFFF" stroke-width="10"/>
  </g>
</svg>
