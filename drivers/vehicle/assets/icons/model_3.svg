<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!-- Model 3: compact sedan silhouette -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <path d="M140 560 L200 420 L340 340 L620 340 L760 420 L820 560" fill="#FFFFFF" stroke="#FFFFFF"/>
    <!-- Roof - lower, sportier roofline -->
    <path d="M340 340 L400 260 L560 260 L620 340" fill="#FFFFFF" stroke="#FFFFFF"/>
    <!-- Undercarriage -->
    <path d="M110 560 L110 600 L270 600 L270 560" fill="#FFFFFF" stroke="#FFFFFF"/>
    <path d="M690 560 L690 600 L850 600 L850 560" fill="#FFFFFF" stroke="#FFFFFF"/>
    <!-- Bottom line -->
    <line x1="270" y1="600" x2="690" y2="600" stroke="#FFFFFF"/>
    <!-- Front wheel -->
    <circle cx="250" cy="600" r="58" fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <circle cx="250" cy="600" r="22" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Rear wheel -->
    <circle cx="710" cy="600" r="58" fill="none" stroke="#FFFFFF" stroke-width="14"/>
    <circle cx="710" cy="600" r="22" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Window - single pane glass roof style -->
    <path d="M360 340 L410 272 L550 272 L600 340" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Headlight accent -->
    <line x1="170" y1="480" x2="210" y2="460" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Taillight accent -->
    <line x1="790" y1="480" x2="750" y2="460" stroke="#FFFFFF" stroke-width="8"/>
  </g>
</svg>
